<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04070d">
<title>BlueFix</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Pacifico&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{background:#04070d; color:#f5f8ff; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden;}
/* weicher Lichtschein im Hintergrund */
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(70% 38% at 50% 6%, rgba(120,180,255,.24), transparent 70%),
    radial-gradient(55% 32% at 95% 92%, rgba(30,111,239,.28), transparent 70%),
    radial-gradient(40% 25% at 0% 60%, rgba(77,163,255,.12), transparent 70%);}
#root{position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh;}
.wb-wrap{width:100%; overflow:hidden; padding-top:env(safe-area-inset-top);}
.wb-stage{position:relative; width:360px; transform-origin:0 0; overflow:hidden;}
.wb-el{position:absolute;}
.wb-tx{line-height:1.25; white-space:pre-wrap; overflow-wrap:anywhere; text-shadow:0 2px 18px rgba(0,0,0,.25);}
.wb-tx a{color:inherit; text-decoration:underline;}
.wb-btn{display:block; text-align:center; padding:14px 12px; border-radius:14px; font:600 17px/1.2 'Inter',sans-serif; text-decoration:none; box-shadow:0 8px 20px -8px rgba(0,0,0,.6); -webkit-tap-highlight-color:transparent; transition:transform .15s ease, filter .15s ease;}
a.wb-btn{animation:wbPulse 2.8s ease-in-out 1.4s infinite;}
a.wb-btn:hover{filter:brightness(1.08);}
a.wb-btn:active{transform:scale(.97);}
/* Elemente blenden nacheinander weich ein */
.wb-el{opacity:0; animation:wbIn .7s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:calc(var(--i,0) * 110ms);}
@keyframes wbIn{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
@keyframes wbPulse{
  0%,100%{box-shadow:0 8px 20px -8px rgba(0,0,0,.6), 0 0 0 0 rgba(255,255,255,.35);}
  60%{box-shadow:0 8px 20px -8px rgba(0,0,0,.6), 0 0 0 12px rgba(255,255,255,0);}
}
@media (prefers-reduced-motion:reduce){
  .wb-el{opacity:1; animation:none;}
  a.wb-btn{animation:none;}
}
.msg{padding:60px 24px; text-align:center; color:#8a99b8;}
.msg h2{color:#f5f8ff; font-family:'Space Grotesk',sans-serif; margin:0 0 6px;}
</style>
</head>
<body>
<div id="root"><div class="msg"><p>Wird geladen …</p></div></div>
<script>
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WB_FONTS=['Inter','Space Grotesk','Poppins','Playfair Display','Bebas Neue','Pacifico','Oswald','Georgia','Courier New'];
const wbCol=(v,d)=>/^#[0-9a-f]{3,8}$/i.test(String(v||''))?v:d;
const wbNum=(v,d,a,b)=>{v=+v;return isFinite(v)?Math.min(b,Math.max(a,v)):d;};
const wbHref=u=>{u=String(u||'').trim();if(!u)return '';if(/^(https?:\/\/|tel:|mailto:)/i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(u))return 'https://'+u;return '';};
const wbLinkify=t=>esc(t).replace(/(https?:\/\/[^\s<]+)/g,m=>'<a href="'+m+'" target="_blank" rel="noopener">'+m+'</a>');
function wbBg(d){const a=wbCol(d.bg,'#0b1730'),b=wbCol(d.bg2,a);return 'background:linear-gradient(160deg,'+a+','+b+');';}
function wbElHtml(e,live){
  const id=esc(e.id||''),pos='left:'+wbNum(e.x,0,-400,800)+'px;top:'+wbNum(e.y,0,-400,2000)+'px;width:'+wbNum(e.w,100,20,720)+'px;';
  const f=WB_FONTS.includes(e.f)?e.f:'Inter';
  if(e.t==='img'){
    if(!/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/i.test(e.src||''))return '';
    return '<div class="wb-el" data-id="'+id+'" style="'+pos+'"><img src="'+e.src+'" alt="" draggable="false" style="display:block;width:100%;height:auto;border-radius:'+wbNum(e.r,0,0,180)+'px"></div>';
  }
  if(e.t==='btn'){
    const h=wbHref(e.url),st='background:'+wbCol(e.bg,'#1e6fef')+';color:'+wbCol(e.c,'#ffffff')+';',t=esc(e.txt||'Öffnen');
    return '<div class="wb-el" data-id="'+id+'" style="'+pos+'">'+(live&&h?'<a class="wb-btn" href="'+esc(h)+'" target="_blank" rel="noopener" style="'+st+'">'+t+'</a>':'<div class="wb-btn" style="'+st+'">'+t+'</div>')+'</div>';
  }
  const al=['left','center','right'].includes(e.a)?e.a:'left';
  return '<div class="wb-el wb-tx" data-id="'+id+'" style="'+pos+'font-family:\''+f+'\',sans-serif;font-size:'+wbNum(e.s,18,8,96)+'px;color:'+wbCol(e.c,'#ffffff')+';font-weight:'+(e.b?700:400)+';font-style:'+(e.i?'italic':'normal')+';text-align:'+al+';">'+wbLinkify(e.txt||'')+'</div>';
}
const wbStageHtml=(d,live)=>(d.els||[]).map(e=>wbElHtml(e,live)).join('');

const firebaseConfig = {
  apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
  authDomain: "bluefix-2255.firebaseapp.com",
  projectId: "bluefix-2255",
  storageBucket: "bluefix-2255.firebasestorage.app",
  messagingSenderId: "317301627140",
  appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
};
const root = document.getElementById('root');
function msg(t, p){ root.innerHTML = '<div class="msg"><h2>' + esc(t) + '</h2><p>' + esc(p) + '</p></div>'; }
function show(d){
  d.h = wbNum(d.h, 520, 200, 1600);
  const a = wbCol(d.bg, '#0b1730'), b = wbCol(d.bg2, a);
  document.body.style.background = 'linear-gradient(160deg,' + a + ',' + b + ') fixed';
  document.querySelector('meta[name=theme-color]').content = a;
  root.innerHTML = '<div class="wb-wrap" id="wrap"><div class="wb-stage" id="stage" style="height:' + d.h + 'px;">' + wbStageHtml(d, true) + '</div></div>';
  // Reihenfolge für die Einblend-Animation (von oben nach unten)
  Array.from(document.querySelectorAll('#stage .wb-el'))
    .sort((x, y) => (parseFloat(x.style.top) || 0) - (parseFloat(y.style.top) || 0))
    .forEach((n, i) => n.style.setProperty('--i', i));
  const fit = () => {
    const w = document.getElementById('wrap').clientWidth || 360, k = w / 360;
    document.getElementById('stage').style.transform = 'scale(' + k + ')';
    document.getElementById('wrap').style.height = (d.h * k) + 'px';
  };
  fit(); window.addEventListener('resize', fit);
}
(function start(){
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f]{32}$/.test(token)) { msg('Link ungültig', 'Bitte öffne den Link aus der Nachricht noch einmal.'); return; }
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    db.collection('bluefix_status').doc(token).get().then(doc => {
      const raw = doc.exists && doc.data().werbung;
      if (!raw) { msg('Seite nicht gefunden', 'Diese Aktion gibt es nicht mehr.'); return; }
      let d; try { d = JSON.parse(raw); } catch (e) { msg('Seite nicht verfügbar', 'Bitte versuche es später noch einmal.'); return; }
      if (!d || !Array.isArray(d.els)) { msg('Seite nicht verfügbar', 'Bitte versuche es später noch einmal.'); return; }
      show(d);
    }).catch(() => msg('Seite gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'));
  } catch (e) { msg('Seite gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'); }
})();
</script>
</body>
</html>
