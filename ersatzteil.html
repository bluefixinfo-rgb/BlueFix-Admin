<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04070d">
<title>Ersatzteil · BlueFix</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#04070d; --white:#f5f8ff; --muted:#8a99b8; --blue:#1e6fef; --blue-light:#4a9cff; --good:#2fbf71; color-scheme:dark;}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:radial-gradient(circle at 15% 0%, rgba(30,111,239,0.20), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(74,156,255,0.10), transparent 45%), var(--bg);
  background-attachment:fixed; color:var(--white); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:max(22px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
.brand{display:flex; justify-content:center; padding:6px 0 10px;}
.brand img{height:46px; width:auto; filter:drop-shadow(0 0 6px rgba(140,190,255,0.3));}
.card{padding:22px 20px; background:rgba(22,34,58,0.5); border:1px solid rgba(255,255,255,0.20); border-radius:22px;}
h1{margin:0 0 8px; font:600 22px 'Space Grotesk',sans-serif;}
p{margin:0 0 12px;}
.txt{white-space:pre-wrap;}
.foto{display:block; width:100%; border-radius:14px; margin:0 0 16px; background:#fff;}
.btn{
  width:100%; padding:14px; border-radius:12px; border:1px solid rgba(255,255,255,0.4); cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#0b3f8a); color:#fff; font:600 16px 'Inter',sans-serif;
  box-shadow:0 0 14px rgba(30,111,239,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn[disabled]{opacity:.6; cursor:default;}
.done{margin:0; color:var(--good); font-weight:600;}
.sub{color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="logo.png" alt="BlueFix"></div>
  <section class="card" id="card"><p class="sub">Wird geladen …</p></section>
</main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
  authDomain: "bluefix-2255.firebaseapp.com",
  projectId: "bluefix-2255",
  storageBucket: "bluefix-2255.firebasestorage.app",
  messagingSenderId: "317301627140",
  appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
};
const COL = 'bluefix_status';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => new Date(ts).toLocaleString('de-CH', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
function msg(title, text){ $('card').innerHTML = '<h1>' + esc(title) + '</h1><p class="sub">' + esc(text) + '</p>'; }

(function start(){
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f]{32}$/.test(token)) { msg('Link ungültig', 'Bitte öffne den Link aus der Nachricht von BlueFix noch einmal.'); return; }
  let ref;
  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    ref = db.collection(COL).doc(token);
  } catch (e) { msg('Gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'); return; }

  ref.onSnapshot(doc => {
    const d = doc.exists ? doc.data() : null, t = d && d.teile;
    if (!d) { msg('Auftrag nicht gefunden', 'Bitte prüfe den Link oder melde dich direkt bei BlueFix.'); return; }
    if (!t || !(t.text || t.foto)) { msg('Noch keine Meldung', 'Zu deinem Auftrag gibt es gerade keine Ersatzteil-Meldung.'); return; }
    const foto = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(t.foto || '') ? t.foto : '';
    const h = '<h1>🔩 ' + (d.vorname ? 'Hallo ' + esc(d.vorname) + ', dein' : 'Dein') + ' Ersatzteil wurde bestellt</h1>' +
      (d.modell ? '<p class="sub">' + esc(d.modell) + '</p>' : '') +
      (t.text ? '<p class="txt">' + esc(t.text) + '</p>' : '') +
      (foto ? '<img class="foto" src="' + foto + '" alt="Ersatzteil">' : '') +
      (t.bestaetigtAt
        ? '<p class="done">✅ Danke! Du hast das am ' + esc(fmt(t.bestaetigtAt)) + ' bestätigt.</p>'
        : '<button class="btn" type="button" id="ok">Ich habe das gesehen ✔</button>');
    if ($('card').dataset.h !== h) { $('card').innerHTML = h; $('card').dataset.h = h; }
    const b = $('ok');
    if (b) b.onclick = () => {
      b.disabled = true; b.textContent = 'Wird gespeichert …';
      ref.update({ 'teile.bestaetigtAt': Date.now() }).catch(err => {
        console.warn(err); b.disabled = false; b.textContent = 'Ich habe das gesehen ✔';
        alert('Das hat leider nicht geklappt. Bitte versuche es gleich noch einmal.');
      });
    };
  }, err => { console.warn(err); msg('Gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'); });
})();
</script>
</body>
</html>
