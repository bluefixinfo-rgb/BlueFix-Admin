<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04070d">
<title>Reparatur-Status · BlueFix</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#04070d; --white:#f5f8ff; --muted:#8a99b8; --blue:#1e6fef; --blue-light:#4a9cff; --bad:#e34848;
  --line:rgba(255,255,255,0.14); --rgb:74,156,255; color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(30,111,239,0.20), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(var(--rgb),0.10), transparent 45%), var(--bg);
  background-attachment:fixed;
  color:var(--white); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:max(22px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
.brand{position:relative; isolation:isolate; display:flex; justify-content:center; padding:6px 0 10px;}
.brand::before{
  content:''; position:absolute; left:50%; top:50%; width:300px; height:120px; transform:translate(-50%,-50%); z-index:-1;
  background:radial-gradient(ellipse at center, rgba(74,156,255,0.28), transparent 70%); filter:blur(20px);
  animation:led 4.5s ease-in-out infinite;
}
.brand img{height:46px; width:auto; filter:drop-shadow(0 0 6px rgba(140,190,255,0.3));}
.card{
  position:relative; isolation:isolate; overflow:hidden; padding:22px 20px;
  background:rgba(22,34,58,0.5); border:1px solid rgba(255,255,255,0.20); border-radius:22px;
  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 26px 50px -28px rgba(0,0,0,0.75);
}
.card::before{content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(120deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03) 30%, transparent 55%);}
h1{margin:0; font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:600; letter-spacing:-0.01em;}
h2{margin:0 0 4px; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600;}
.device{display:flex; align-items:center; gap:8px; margin:6px 0 0; color:var(--muted); font-size:15px;}
.device svg{width:17px; height:17px; flex:none;}
.sub{margin:0; color:var(--muted); font-size:14px;}

/* aktueller Status mit blinkendem Punkt */
.now{
  display:flex; align-items:center; gap:14px; margin:20px 0 22px; padding:15px 16px; border-radius:16px;
  background:rgba(var(--rgb),0.13); border:1px solid rgba(var(--rgb),0.45);
  animation:glow 2.6s ease-in-out infinite;
}
.now b{display:block; font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600; color:rgb(var(--rgb));}
.now span{color:var(--muted); font-size:13.5px;}
.pulse{position:relative; flex:none; width:14px; height:14px;}
.pulse i,.pulse::before{content:''; position:absolute; inset:0; border-radius:50%; background:rgb(var(--rgb));}
.pulse i{animation:blink 1.4s ease-in-out infinite; box-shadow:0 0 12px rgb(var(--rgb));}
.pulse::before{animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite;}

/* Fortschritt */
.track{position:relative; display:grid; grid-template-columns:repeat(3,1fr); margin:0; padding:0; list-style:none; text-align:center;}
.line{position:absolute; top:21px; left:16.667%; right:16.667%; height:3px; border-radius:3px; background:var(--line);}
.line i{display:block; height:100%; border-radius:3px; background:rgb(var(--rgb)); box-shadow:0 0 10px rgba(var(--rgb),0.7); transition:width .6s ease;}
.track li{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); font-weight:500;}
.ico{
  position:relative; width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:#0a1220; border:2px solid var(--line); color:var(--muted);
}
.ico svg{width:20px; height:20px;}
.done .ico{border-color:rgb(var(--rgb)); background:rgba(var(--rgb),0.18); color:rgb(var(--rgb));}
.cur{color:var(--white);}
.cur .ico{border-color:rgb(var(--rgb)); background:rgb(var(--rgb)); color:#04070d; box-shadow:0 0 18px rgba(var(--rgb),0.6);}
.cur .ico::after{content:''; position:absolute; inset:-2px; border-radius:50%; border:2px solid rgb(var(--rgb)); animation:ping 1.8s cubic-bezier(0,0,.2,1) infinite;}

/* Übergabe */
.opts{display:grid; gap:10px; margin-top:16px;}
.opt{
  display:flex; align-items:center; gap:14px; text-align:left; width:100%; padding:15px 16px; border-radius:16px; cursor:pointer;
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.18); color:var(--white); font:inherit;
  transition:border-color .2s, transform .2s, background .2s;
}
.opt:hover,.opt:focus-visible{border-color:var(--blue-light); background:rgba(74,156,255,0.10); transform:translateY(-1px); outline:none;}
.opt svg{width:26px; height:26px; flex:none; color:var(--blue-light);}
.opt b{display:block; font-family:'Space Grotesk',sans-serif; font-size:16px;}
.opt span{color:var(--muted); font-size:13px;}
.field{margin-top:12px;}
.field label{display:block; margin-bottom:5px; color:var(--muted); font-size:12.5px;}
.field input{
  width:100%; padding:12px 13px; border-radius:12px; font:inherit; font-size:16px; color:var(--white);
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
}
.field input:focus{outline:none; border-color:var(--blue-light); box-shadow:0 0 0 3px rgba(74,156,255,0.2);}
.row{display:grid; grid-template-columns:110px 1fr; gap:10px;}
.btns{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
.btn{
  flex:1; min-width:130px; padding:13px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.4); cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#0b3f8a); color:#fff; font:600 15px 'Inter',sans-serif; text-align:center; text-decoration:none;
  box-shadow:0 0 14px rgba(30,111,239,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn.ghost{background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.22); box-shadow:none;}
.btn[disabled]{opacity:.6; cursor:default;}
.err{margin:12px 0 0; color:#ff9a9a; font-size:13.5px;}
.recap{margin-top:14px; padding:13px 14px; border-radius:14px; background:rgba(255,255,255,0.05); border:1px solid var(--line); font-size:14.5px;}
.recap small{display:block; color:var(--muted); font-size:12.5px; margin-bottom:3px;}
.trk{
  display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding:15px 16px; border-radius:14px;
  background:rgba(47,191,113,0.12); border:1px solid rgba(47,191,113,0.4); color:inherit; text-decoration:none;
  -webkit-tap-highlight-color:transparent; transition:background .2s, border-color .2s, transform .2s;
}
a.trk:hover,a.trk:focus-visible{background:rgba(47,191,113,0.2); border-color:rgba(47,191,113,0.75); transform:translateY(-1px); outline:none;}
a.trk:active{transform:scale(.99);}
.trk small{display:block; color:var(--muted); font-size:12.5px;}
.trk b{font-family:'Space Grotesk',sans-serif; font-size:20px; letter-spacing:.02em; word-break:break-all; text-decoration:underline; text-decoration-color:rgba(47,191,113,0.55); text-underline-offset:4px;}
.trk svg{width:24px; height:24px; flex:none; color:#2fbf71;}

/* Lieferwagen mit Paket */
.scene{position:relative; margin:16px 0 0; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.16);
  background:linear-gradient(180deg,#0b1730 0%,#15305c 60%,#23508f 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,0.18);}
.scene svg{display:block; width:100%; height:auto;}
.sc-cloud{animation:drift 26s linear infinite;}
.sc-city{animation:drift 9s linear infinite;}
.sc-road{animation:road .7s linear infinite;}
.sc-truck{animation:bob .8s ease-in-out infinite;}
.sc-wheel{transform-box:fill-box; transform-origin:center; animation:spin .55s linear infinite;}
.sc-speed line{animation:speed .9s linear infinite;}
.sc-beam{animation:led 2.4s ease-in-out infinite;}
@keyframes drift{to{transform:translateX(-160px);}}
@keyframes road{to{stroke-dashoffset:-26;}}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-1.6px);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes speed{0%{transform:translateX(0); opacity:0;}30%{opacity:.8;}100%{transform:translateX(-22px); opacity:0;}}
.msg{text-align:center; padding:14px 0;}
.msg p{margin:0; color:var(--muted);}
.call{display:none; text-align:center;}
[hidden]{display:none !important;}

@keyframes ping{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(2.4); opacity:0;}}
@keyframes blink{0%,100%{opacity:1;} 50%{opacity:.35;}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(var(--rgb),0);} 50%{box-shadow:0 0 22px 0 rgba(var(--rgb),0.28);}}
@keyframes led{0%,100%{opacity:.7;} 50%{opacity:1;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="logo.png" alt="BlueFix"></div>
  <section class="card" id="card"><div class="msg"><p>Status wird geladen …</p></div></section>
  <section class="card" id="ship" hidden></section>
  <a class="btn ghost call" id="call" href="#">BlueFix anrufen</a>
</main>

<script>
/* Optional: Telefonnummer des Shops (z.B. '+41 44 000 00 00'). Leer lassen = kein Anruf-Button. */
const SHOP_TEL = '';

/* Abholung bei BlueFix */
const PICKUP_ADDR_HTML = 'BlueFix Handy Reparatur<br>Weierbuckstrasse 1<br>8213 Neunkirch<br>Schweiz';
const PICKUP_MAPS = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent('Weierbuckstrasse 1, 8213 Neunkirch, Schweiz');
/* Wie oft der Kunde seine Auswahl nach der ersten Wahl noch ändern darf */
const MAX_CHANGES = 1;
const CONTACT_MAIL = 'BlueFix.info@gmail.com';
function contactMailHref(d){
  const body = 'Guten Tag\n\nich möchte meine Auswahl (Abholung / Versand) ändern.\n\nName: ' + (d.vorname || '') + '\nGerät: ' + (d.modell || '') + '\nStatus-Link: ' + location.href + '\n\nFreundliche Grüsse';
  return 'mailto:' + CONTACT_MAIL + '?subject=' + encodeURIComponent('Auswahl ändern – ' + (d.modell || 'Gerät')) + '&body=' + encodeURIComponent(body);
}
const changesUsed = d => (d && d.wunsch && d.wunsch.changes) || 0;

const firebaseConfig = {
  apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
  authDomain: "bluefix-2255.firebaseapp.com",
  projectId: "bluefix-2255",
  storageBucket: "bluefix-2255.firebasestorage.app",
  messagingSenderId: "317301627140",
  appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
};

const IC = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  store:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>'
};
const STEPS = [
  { k:'angenommen', t:'Angenommen',   title:'Gerät angenommen', d:'Wir haben dein Gerät erhalten.',        rgb:'74,156,255', ic:IC.inbox },
  { k:'reparatur',  t:'In Reparatur', title:'In Reparatur',     d:'Wir arbeiten gerade an deinem Gerät.', rgb:'245,166,35', ic:IC.wrench },
  { k:'fertig',     t:'Fertig',       title:'Fertig',           d:'Dein Gerät ist bereit für dich.',      rgb:'47,191,113', ic:IC.check }
];
const COL = 'bluefix_status';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let db = null, token = '', cur = null, ui = 'auto', errMsg = '', viewLogged = false;

/* Zählt einen Linkaufruf (nur einmal pro Seitenaufruf), sichtbar im Admin-Bereich beim Status-Link */
function logView(tok){
  try {
    db.collection(COL).doc(tok).set({
      viewCount: firebase.firestore.FieldValue.increment(1),
      lastViewedAt: Date.now(),
      views: firebase.firestore.FieldValue.arrayUnion(Date.now())
    }, { merge: true }).catch(e => console.warn('Aufruf konnte nicht gezählt werden:', e));
  } catch (e) {}
}

function render(){
  const d = cur;
  const idx = Math.max(0, STEPS.findIndex(s => s.k === d.status)), S = STEPS[idx];
  document.documentElement.style.setProperty('--rgb', S.rgb);
  $('card').innerHTML = `
    <h1>${d.vorname ? 'Hallo ' + esc(d.vorname) : 'Hallo'}</h1>
    ${d.modell ? `<p class="device">${IC.phone}${esc(d.modell)}</p>` : ''}
    <div class="now"><span class="pulse"><i></i></span><div><b>${S.title}</b><span>${S.d}</span></div></div>
    <ol class="track">
      <div class="line"><i style="width:${idx * 50}%"></i></div>
      ${STEPS.map((s, i) => `<li class="${i < idx ? 'done' : i === idx ? 'cur' : ''}"><span class="ico">${i < idx ? IC.check : s.ic}</span>${s.t}</li>`).join('')}
    </ol>`;
  const box = $('ship');
  box.hidden = S.k !== 'fertig';
  if (!box.hidden) box.innerHTML = shipHtml(d);
}

function addr(w){
  return `${esc(w.name)}<br>${esc(w.strasse)}<br>${esc(w.plz)} ${esc(w.ort)}${w.land && w.land !== 'Schweiz' ? '<br>' + esc(w.land) : ''}`;
}
/* Schweizer Post: offizieller Tracking-Link, die Nummer ist schon eingetragen (ein eingefügter Link bleibt unverändert) */
function trackUrl(nr){
  const t = String(nr || '').trim();
  if (/^https?:\/\//i.test(t)) return t;
  return 'https://www.post.ch/swisspost-tracking?formattedParcelCodes=' + encodeURIComponent(t.replace(/\s+/g, ''));
}
const TRUCK = `<div class="scene"><svg viewBox="0 0 320 140" role="img" aria-label="Lieferwagen mit Paket ist unterwegs">
  <defs>
    <g id="bf-city" fill="rgba(74,156,255,0.16)"><rect x="4" y="66" width="20" height="50"/><rect x="28" y="52" width="16" height="64"/><rect x="48" y="72" width="24" height="44"/><rect x="76" y="58" width="14" height="58"/><rect x="94" y="76" width="22" height="40"/><rect x="120" y="48" width="18" height="68"/><rect x="142" y="70" width="14" height="46"/></g>
    <g id="bf-cloud" fill="rgba(255,255,255,0.10)"><ellipse cx="34" cy="26" rx="18" ry="6"/><ellipse cx="48" cy="22" rx="12" ry="6"/><ellipse cx="112" cy="42" rx="16" ry="5"/><ellipse cx="124" cy="38" rx="10" ry="5"/></g>
    <linearGradient id="bf-beam" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#fff6b8" stop-opacity=".38"/><stop offset="1" stop-color="#fff6b8" stop-opacity="0"/></linearGradient>
  </defs>
  <g class="sc-cloud"><use href="#bf-cloud"/><use href="#bf-cloud" x="160"/><use href="#bf-cloud" x="320"/></g>
  <g class="sc-city"><use href="#bf-city"/><use href="#bf-city" x="160"/><use href="#bf-city" x="320"/></g>
  <rect x="0" y="114" width="320" height="26" fill="#0a1220"/>
  <rect x="0" y="114" width="320" height="2" fill="rgba(255,255,255,0.14)"/>
  <line class="sc-road" x1="0" y1="128" x2="320" y2="128" stroke="rgba(245,248,255,0.55)" stroke-width="2.5" stroke-dasharray="14 12"/>
  <g class="sc-speed" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round">
    <line x1="46" y1="50" x2="66" y2="50"/><line x1="36" y1="68" x2="62" y2="68" style="animation-delay:.3s"/><line x1="48" y1="86" x2="68" y2="86" style="animation-delay:.6s"/>
  </g>
  <ellipse cx="176" cy="116" rx="112" ry="3.5" fill="rgba(0,0,0,0.4)"/>
  <g transform="translate(34 0)"><g class="sc-truck">
    <rect x="38" y="96" width="210" height="8" rx="2" fill="#1b2438"/>
    <rect x="40" y="30" width="142" height="66" rx="4" fill="#ffcc00"/>
    <path d="M40 84H182V92a4 4 0 0 1-4 4H44a4 4 0 0 1-4-4z" fill="#e0ad00"/>
    <g transform="translate(111 57)">
      <rect x="-24" y="-18" width="48" height="36" rx="3" fill="#c98f4f" stroke="#8a5a2b" stroke-width="2"/>
      <rect x="-5" y="-18" width="10" height="36" fill="#ecd2a6"/>
      <path d="M-24 -6H24" stroke="#8a5a2b" stroke-width="1.5" opacity=".55"/>
      <rect x="8" y="3" width="13" height="9" rx="1" fill="#fff" opacity=".85"/>
    </g>
    <path d="M182 44H212Q220 44 225 52L238 72Q241 77 241 82V96H182Z" fill="#ffd21f"/>
    <path d="M190 52H210Q214 52 217 57L225 72H190Z" fill="#9fd3ff" opacity=".92"/>
    <path d="M194 55L203 55L196 69L194 69Z" fill="#fff" opacity=".35"/>
    <path d="M190 76V94" stroke="#c99a00" stroke-width="1.5"/>
    <rect x="180" y="93" width="64" height="6" rx="2" fill="#2a3448"/>
    <rect x="236" y="80" width="6" height="7" rx="2" fill="#fff6b8"/>
    <path class="sc-beam" d="M242 82L318 72V98L242 87Z" fill="url(#bf-beam)"/>
    <circle cx="78" cy="104" r="13" fill="#0a1220"/><circle cx="108" cy="104" r="13" fill="#0a1220"/><circle cx="214" cy="104" r="13" fill="#0a1220"/>
    <g class="sc-wheel"><circle cx="78" cy="104" r="10" fill="#0e1524"/><circle cx="78" cy="104" r="5.5" fill="#aab6cf"/><path d="M73 104H83M78 99V109" stroke="#5b6785" stroke-width="1.6"/></g>
    <g class="sc-wheel"><circle cx="108" cy="104" r="10" fill="#0e1524"/><circle cx="108" cy="104" r="5.5" fill="#aab6cf"/><path d="M103 104H113M108 99V109" stroke="#5b6785" stroke-width="1.6"/></g>
    <g class="sc-wheel"><circle cx="214" cy="104" r="10" fill="#0e1524"/><circle cx="214" cy="104" r="5.5" fill="#aab6cf"/><path d="M209 104H219M214 99V109" stroke="#5b6785" stroke-width="1.6"/></g>
  </g></g>
</svg></div>`;
const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>';

function shipHtml(d){
  const w = d.wunsch;
  if (d.sendungsnr) {
    const href = esc(trackUrl(d.sendungsnr));
    return `<h2>Dein Gerät ist unterwegs</h2><p class="sub">Wir haben es per Post an dich geschickt.</p>
      ${TRUCK}
      <a class="trk" target="_blank" rel="noopener" href="${href}"><span><small>Sendungsnummer · antippen</small><b>${esc(d.sendungsnr)}</b></span>${ARROW}</a>
      <div class="btns"><button class="btn ghost" data-a="copy">Nummer kopieren</button>
      <a class="btn" target="_blank" rel="noopener" href="${href}">Sendung verfolgen</a></div>
      ${w && w.art === 'post' ? `<div class="recap"><small>Lieferadresse</small>${addr(w)}</div>` : ''}`;
  }
  if (ui === 'form') {
    const v = w && w.art === 'post' ? w : { name:'', strasse:'', plz:'', ort:'', land:'Schweiz' };
    return `<h2>Lieferadresse</h2><p class="sub">Wir schicken dir dein Gerät per Post.</p>
      <div class="field"><label>Vor- und Nachname</label><input id="f-name" autocomplete="name" value="${esc(v.name || d.vorname || '')}"></div>
      <div class="field"><label>Strasse und Nr.</label><input id="f-strasse" autocomplete="address-line1" value="${esc(v.strasse)}"></div>
      <div class="row"><div class="field"><label>PLZ</label><input id="f-plz" inputmode="numeric" autocomplete="postal-code" maxlength="5" value="${esc(v.plz)}"></div>
      <div class="field"><label>Ort</label><input id="f-ort" autocomplete="address-level2" value="${esc(v.ort)}"></div></div>
      <div class="field"><label>Land</label><input id="f-land" autocomplete="country-name" value="${esc(v.land || 'Schweiz')}"></div>
      ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}
      <div class="btns"><button class="btn ghost" data-a="back">Zurück</button><button class="btn" data-a="send-post">Absenden</button></div>`;
  }
  if (w && ui !== 'choose') {
    const left = MAX_CHANGES - changesUsed(d);
    return `<h2>${w.art === 'post' ? 'Versand per Post' : 'Abholung bei BlueFix'}</h2>
      <p class="sub">${w.art === 'post' ? 'Danke! Wir schicken dir dein Gerät. Sobald es unterwegs ist, siehst du hier deine Sendungsnummer.' : 'Danke! Wir freuen uns auf deinen Besuch.'}</p>
      ${w.art === 'post' ? `<div class="recap"><small>Lieferadresse</small>${addr(w)}</div>` : `<div class="recap"><small>Abholadresse</small>${PICKUP_ADDR_HTML}</div>`}
      <div class="btns">${w.art !== 'post' ? `<a class="btn" target="_blank" rel="noopener" href="${PICKUP_MAPS}">Route öffnen</a>` : ''}${left > 0 ? '<button class="btn ghost" data-a="change">Auswahl ändern</button>' : `<a class="btn ghost" href="${contactMailHref(d)}">E-Mail an BlueFix</a>`}</div>
      <p class="sub" style="margin-top:14px;">${left > 0 ? 'Du kannst deine Auswahl noch einmal ändern.' : 'Du hast deine Auswahl bereits geändert. Wenn du nochmals etwas ändern möchtest, schreibe uns bitte kurz per E-Mail an ' + CONTACT_MAIL + '.'}</p>`;
  }
  return `<h2>Wie möchtest du dein Gerät erhalten?</h2><p class="sub">Wähle eine Option, wir kümmern uns um den Rest.</p>
    <div class="opts">
      <button class="opt" data-a="abholen">${IC.store}<div><b>Bei BlueFix abholen</b><span>Weierbuckstrasse 1, 8213 Neunkirch</span></div></button>
      <button class="opt" data-a="post-form">${IC.box}<div><b>Per Post schicken lassen</b><span>Du bekommst eine Sendungsnummer.</span></div></button>
    </div>${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}${w ? '<div class="btns"><button class="btn ghost" data-a="back">Abbrechen</button></div>' : ''}`;
}

async function saveWish(w){
  errMsg = '';
  const used = cur && cur.wunsch ? changesUsed(cur) + 1 : 0; // erste Wahl zählt nicht, jede spätere ist eine Änderung
  if (used > MAX_CHANGES) { ui = 'auto'; render(); return; }
  try { await db.collection(COL).doc(token).update({ wunsch: { ...w, changes: used, at: Date.now() } }); ui = 'auto'; }
  catch (e) { console.warn(e); errMsg = 'Das hat leider nicht geklappt. Bitte versuche es gleich noch einmal.'; }
  render();
}
$('ship').addEventListener('click', async e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'abholen') { b.disabled = true; saveWish({ art:'abholen' }); }
  else if (a === 'post-form' || a === 'change') {
    if (a === 'change' && changesUsed(cur) >= MAX_CHANGES) { render(); return; }
    ui = a === 'change' ? 'choose' : 'form'; errMsg = ''; render();
  }
  else if (a === 'back') { ui = 'auto'; errMsg = ''; render(); }
  else if (a === 'send-post') {
    const w = { art:'post', name:$('f-name').value.trim(), strasse:$('f-strasse').value.trim(), plz:$('f-plz').value.trim(), ort:$('f-ort').value.trim(), land:$('f-land').value.trim() || 'Schweiz' };
    if (w.name.length < 3 || w.strasse.length < 3 || !/^\d{4,5}$/.test(w.plz) || w.ort.length < 2) {
      errMsg = 'Bitte fülle alle Felder vollständig aus (PLZ mit 4 oder 5 Ziffern).'; render(); return;
    }
    b.disabled = true; saveWish(w);
  }
  else if (a === 'copy') { try { await navigator.clipboard.writeText(cur.sendungsnr); b.textContent = 'Kopiert ✓'; } catch (err) {} }
});

function showMessage(title, text){
  $('ship').hidden = true;
  $('card').innerHTML = `<div class="msg"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
}

(function start(){
  token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f]{32}$/.test(token)) { showMessage('Link ungültig', 'Bitte scanne den QR-Code noch einmal oder frag bei BlueFix nach einem neuen Link.'); return; }
  if (SHOP_TEL) { const a = $('call'); a.href = 'tel:' + SHOP_TEL.replace(/[^\d+]/g, ''); a.style.display = 'block'; }
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    db.collection(COL).doc(token).onSnapshot(doc => {
      if (!doc.exists) { showMessage('Auftrag nicht gefunden', 'Bitte prüfe den Link oder melde dich direkt bei BlueFix.'); return; }
      cur = doc.data();
      if (!viewLogged) { viewLogged = true; logView(token); }
      if (ui === 'form' && document.activeElement && document.activeElement.tagName === 'INPUT') return; // nicht beim Tippen überschreiben
      render();
    }, err => { console.warn(err); showMessage('Status gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'); });
  } catch (e) { showMessage('Status gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.'); }
})();
</script>
</body>
</html>
