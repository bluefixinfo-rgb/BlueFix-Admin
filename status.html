<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#04070d">
<title>Reparatur-Status · BlueFix</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#04070d; --white:#f5f8ff; --muted:#8a99b8; --blue:#1e6fef; --blue-light:#4a9cff;
  --good:#2fbf71; --line:rgba(255,255,255,0.14);
  --card:rgba(22,34,58,0.5);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:radial-gradient(circle at 20% 0%, rgba(30,111,239,0.16), transparent 55%), var(--bg);
  color:var(--white); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:max(20px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
}
main{max-width:460px; margin:0 auto;}
header{display:flex; align-items:center; gap:12px; padding:8px 0 22px;}
header img{width:40px; height:40px; border-radius:10px;}
header b{display:block; font-family:'Space Grotesk',sans-serif; font-size:18px;}
header span{color:var(--muted); font-size:13px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:20px; padding:24px 22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), 0 24px 50px -28px rgba(0,0,0,0.7);
}
.hello{margin:0; font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600;}
.device{margin:4px 0 0; color:var(--muted); font-size:15px;}
.now{
  margin:22px 0 4px; padding:14px 16px; border-radius:14px;
  background:rgba(30,111,239,0.14); border:1px solid rgba(74,156,255,0.35);
  font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:600;
}
.now.fertig{background:rgba(47,191,113,0.14); border-color:rgba(47,191,113,0.45); color:#7be0a8;}
.steps{list-style:none; margin:22px 0 0; padding:0;}
.steps li{position:relative; display:flex; gap:14px; padding:0 0 22px;}
.steps li:last-child{padding-bottom:0;}
.steps li::before{
  content:''; position:absolute; left:13px; top:28px; bottom:2px; width:2px; background:var(--line);
}
.steps li:last-child::before{display:none;}
.steps li.done::before{background:var(--good);}
.dot{
  flex:0 0 28px; height:28px; border-radius:50%; display:grid; place-items:center;
  border:2px solid var(--line); background:var(--bg); color:var(--muted); font-size:13px; font-weight:700; z-index:1;
}
.done .dot{background:var(--good); border-color:var(--good); color:#04120a;}
.cur .dot{border-color:var(--blue-light); color:var(--blue-light); box-shadow:0 0 0 4px rgba(74,156,255,0.18);}
.cur.fertig .dot{background:var(--good); border-color:var(--good); color:#04120a; box-shadow:0 0 0 4px rgba(47,191,113,0.2);}
.steps h3{margin:2px 0 2px; font-size:15.5px; font-weight:600;}
.steps p{margin:0; color:var(--muted); font-size:13.5px;}
.pending h3{color:var(--muted); font-weight:500;}
.updated{margin:24px 0 0; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:12.5px;}
.call{
  display:none; margin-top:16px; text-align:center; padding:13px; border-radius:12px; text-decoration:none;
  background:linear-gradient(135deg,var(--blue),#0b3f8a); color:#fff; font-weight:600;
}
.msg{text-align:center; padding:12px 0;}
.msg h2{margin:0 0 8px; font-family:'Space Grotesk',sans-serif; font-size:20px;}
.msg p{margin:0; color:var(--muted);}
@media (prefers-reduced-motion:no-preference){ .cur .dot{transition:box-shadow .4s ease;} }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon-192.png" alt="" onerror="this.style.display='none'">
    <div><b>BlueFix</b><span>Reparatur-Status</span></div>
  </header>
  <div class="card" id="card"><div class="msg"><p>Status wird geladen …</p></div></div>
  <a class="call" id="call" href="#">BlueFix anrufen</a>
</main>

<script>
/* Optional: Telefonnummer des Shops (z.B. '+41 44 000 00 00'). Leer lassen = kein Anruf-Button. */
const SHOP_TEL = '';

const firebaseConfig = {
  apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
  authDomain: "bluefix-2255.firebaseapp.com",
  projectId: "bluefix-2255",
  storageBucket: "bluefix-2255.firebasestorage.app",
  messagingSenderId: "317301627140",
  appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
};

const STEPS = [
  { k:'angenommen', t:'Gerät angenommen',    d:'Dein Gerät ist bei uns eingegangen.' },
  { k:'reparatur',  t:'In Reparatur',        d:'Wir arbeiten gerade an deinem Gerät.' },
  { k:'fertig',     t:'Fertig zur Abholung', d:'Du kannst dein Gerät bei uns abholen.' }
];

const card = document.getElementById('card');
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function showMessage(title, text){
  card.replaceChildren();
  const box = el('div', 'msg');
  box.append(el('h2', null, title), el('p', null, text));
  card.append(box);
}

function render(d){
  const idx = Math.max(0, STEPS.findIndex(s => s.k === d.status));
  const fertig = STEPS[idx].k === 'fertig';
  card.replaceChildren();

  card.append(el('h1', 'hello', d.vorname ? 'Hallo ' + d.vorname : 'Hallo'));
  if (d.modell) card.append(el('p', 'device', d.modell));
  card.append(el('div', 'now' + (fertig ? ' fertig' : ''), STEPS[idx].t));

  const ol = el('ol', 'steps');
  STEPS.forEach((s, i) => {
    const state = i < idx ? 'done' : i === idx ? (fertig ? 'done cur fertig' : 'cur') : 'pending';
    const li = el('li', state);
    li.append(el('div', 'dot', i < idx || (i === idx && fertig) ? '✓' : String(i + 1)));
    const txt = el('div');
    txt.append(el('h3', null, s.t));
    if (i <= idx) txt.append(el('p', null, s.d));
    li.append(txt);
    ol.append(li);
  });
  card.append(ol);

  if (d.updatedAt) {
    const when = new Date(d.updatedAt).toLocaleString('de-CH', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    card.append(el('p', 'updated', 'Zuletzt aktualisiert: ' + when + ' · Diese Seite aktualisiert sich automatisch.'));
  }
}

(function start(){
  const token = new URLSearchParams(location.search).get('t') || '';
  if (!/^[0-9a-f]{32}$/.test(token)) { showMessage('Link ungültig', 'Bitte scanne den QR-Code noch einmal oder frag bei BlueFix nach einem neuen Link.'); return; }

  if (SHOP_TEL) { const a = document.getElementById('call'); a.href = 'tel:' + SHOP_TEL.replace(/[^\d+]/g, ''); a.style.display = 'block'; }

  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
    db.collection('bluefix_status').doc(token).onSnapshot(doc => {
      if (!doc.exists) { showMessage('Auftrag nicht gefunden', 'Bitte prüfe den Link oder melde dich direkt bei BlueFix.'); return; }
      render(doc.data());
    }, err => {
      console.warn(err);
      showMessage('Status gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.');
    });
  } catch (e) {
    showMessage('Status gerade nicht verfügbar', 'Bitte versuche es in ein paar Minuten noch einmal.');
  }
})();
</script>
</body>
</html>
