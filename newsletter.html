<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<title>Newsletter · BlueFix</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#04070d; --white:#f5f8ff; --muted:#8a99b8; --blue:#1e6fef; --blue-light:#4a9cff; --good:#2fbf71;
  --line:rgba(255,255,255,0.14); color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(30,111,239,0.22), transparent 50%),
    radial-gradient(circle at 100% 100%, rgba(74,156,255,0.10), transparent 45%), var(--bg);
  background-attachment:fixed;
  color:var(--white); font-family:'Inter',system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
  padding:max(22px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
}
main{max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:14px;}
.brand{position:relative; isolation:isolate; display:flex; justify-content:center; padding:6px 0 10px;}
.brand::before{
  content:''; position:absolute; left:50%; top:50%; width:300px; height:120px; transform:translate(-50%,-50%); z-index:-1;
  background:radial-gradient(ellipse at center, rgba(74,156,255,0.28), transparent 70%); filter:blur(20px);
  animation:led 4.5s ease-in-out infinite;
}
.brand img{height:46px; width:auto; filter:drop-shadow(0 0 6px rgba(140,190,255,0.3));}
.card{
  position:relative; isolation:isolate; overflow:hidden; padding:24px 20px;
  background:rgba(22,34,58,0.5); border:1px solid rgba(255,255,255,0.20); border-radius:22px;
  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45), 0 26px 50px -28px rgba(0,0,0,0.75);
}
.card::before{content:''; position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(120deg, rgba(255,255,255,0.16), rgba(255,255,255,0.03) 30%, transparent 55%);}
h1{margin:0 0 6px; font-family:'Space Grotesk',sans-serif; font-size:25px; font-weight:600; letter-spacing:-0.01em;}
.sub{margin:0; color:var(--muted); font-size:14.5px;}
.field{margin-top:16px;}
.field label{display:block; margin-bottom:6px; color:var(--muted); font-size:12.5px;}
.field input{
  width:100%; padding:13px 14px; border-radius:12px; font:inherit; font-size:16px; color:var(--white);
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.18);
}
.field input:focus{outline:none; border-color:var(--blue-light); box-shadow:0 0 0 3px rgba(74,156,255,0.2);}
.or{display:flex; align-items:center; gap:12px; margin-top:16px; color:var(--muted); font-size:12.5px; text-transform:uppercase; letter-spacing:.08em;}
.or::before,.or::after{content:''; flex:1; height:1px; background:var(--line);}
.btn{
  display:block; width:100%; margin-top:20px; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.4); cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#0b3f8a); color:#fff; font:600 16px 'Inter',sans-serif; text-align:center;
  box-shadow:0 0 14px rgba(30,111,239,0.4), inset 0 1px 0 rgba(255,255,255,0.4);
}
.btn[disabled]{opacity:.6; cursor:default;}
.err{margin:14px 0 0; color:#ff9a9a; font-size:13.5px;}
.fine{margin:16px 0 0; color:var(--muted); font-size:12px; line-height:1.55;}
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}
.done{text-align:center; padding:10px 0 4px;}
.done .tick{
  width:64px; height:64px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center;
  background:rgba(47,191,113,0.16); border:2px solid var(--good); color:var(--good);
  animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;
}
.done .tick svg{width:30px; height:30px;}
[hidden]{display:none !important;}
@keyframes led{0%,100%{opacity:.7;} 50%{opacity:1;}}
@keyframes pop{0%{transform:scale(0); opacity:0;} 100%{transform:scale(1); opacity:1;}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important; transition:none !important;}}
</style>
</head>
<body>
<main>
  <div class="brand"><img src="logo.png" alt="BlueFix"></div>

  <section class="card" id="formCard">
    <h1>Newsletter</h1>
    <p class="sub">Erfahre als Erste/r von unseren Aktionen und Angeboten rund um deine Handy-Reparatur.</p>
    <div id="formBox">
      <div class="field"><label for="email">E-Mail</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="name@beispiel.ch"></div>
      <div class="or">oder</div>
      <div class="field" style="margin-top:12px;"><label for="tel">Handynummer</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="079 123 45 67"></div>
      <div class="hp" aria-hidden="true"><label>Website<input id="hp" type="text" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="err" hidden></p>
      <button class="btn" id="go" type="button">Eintragen</button>
    </div>
    <div class="done" id="doneBox" hidden>
      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>Danke!</h1>
      <p class="sub">Du bist eingetragen. Wir melden uns, sobald es etwas Neues gibt.</p>
    </div>
  </section>
</main>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
  authDomain: "bluefix-2255.firebaseapp.com",
  projectId: "bluefix-2255",
  storageBucket: "bluefix-2255.firebasestorage.app",
  messagingSenderId: "317301627140",
  appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
};
const COL = 'bluefix_status';
const $ = id => document.getElementById(id);
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.settings({ experimentalAutoDetectLongPolling: true, useFetchStreams: false });
} catch (e) { console.warn(e); }

/* Handynummer -> internationales Format ohne "+" (Standard: Schweiz) */
function normPhone(raw){
  let d = String(raw || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1);
  else if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = '41' + d.slice(1);
  else if (/^7[5-9]\d{7}$/.test(d)) d = '41' + d;
  return /^\d{9,15}$/.test(d) ? d : null;
}
async function sha256Hex(s){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}
function showErr(t){ const e = $('err'); e.textContent = t; e.hidden = !t; }

$('go').addEventListener('click', async () => {
  showErr('');
  if ($('hp').value) { $('formBox').hidden = true; $('doneBox').hidden = false; return; }   // Spam-Roboter
  const mail = $('email').value.trim().toLowerCase();
  const telRaw = $('tel').value.trim();
  if (!mail && !telRaw) { showErr('Bitte gib deine E-Mail oder deine Handynummer ein.'); return; }
  if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) { showErr('Bitte prüfe deine E-Mail-Adresse.'); return; }
  const tel = telRaw ? normPhone(telRaw) : '';
  if (telRaw && !tel) { showErr('Bitte prüfe deine Handynummer, z.B. 079 123 45 67.'); return; }
  if (!db) { showErr('Das hat leider nicht geklappt. Bitte versuche es gleich noch einmal.'); return; }
  const btn = $('go'); btn.disabled = true; btn.textContent = 'Einen Moment …';
  try {
    const id = 'nl_' + (await sha256Hex((mail || '-') + '|' + (tel || '-'))).slice(0, 32);
    await Promise.race([
      db.collection(COL).doc(id).set({ typ: 'newsletter', email: mail, tel: tel, at: Date.now() }),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))
    ]);
    $('formBox').hidden = true; $('doneBox').hidden = false;
  } catch (e) {
    console.warn(e);
    showErr('Das hat leider nicht geklappt. Bitte versuche es gleich noch einmal.');
    btn.disabled = false; btn.textContent = 'Eintragen';
  }
});
['email', 'tel'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); }));
</script>
</body>
</html>
